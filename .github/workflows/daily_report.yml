name: 광고 리포트 자동 수집

on:
  schedule:
    # 매일 오전 6시 KST = 21:00 UTC (전날)
    - cron: "0 21 * * *"
  workflow_dispatch:  # 수동 실행 버튼
    inputs:
      test_date:
        description: '테스트 날짜 (YYYY-MM-DD, 비워두면 전날 자동)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-22.04

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Playwright Chromium 설치
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 광고 리포트 수집 실행
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PW: ${{ secrets.ADMIN_PW }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          TEST_DATE: ${{ github.event.inputs.test_date }}
        run: python scraper.py

      - name: 오류 스크린샷 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
          if-no-files-found: ignore
